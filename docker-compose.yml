# ============================================================================
# ollamyn API - Orquestación de servicios para desarrollo/producción
#   docker compose up -d
# ============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollamyn-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://ollamyn:ollamyn@postgres:5432/ollamyn?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ollamyn-net

  postgres:
    image: postgres:16-alpine
    container_name: ollamyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ollamyn
      POSTGRES_PASSWORD: ollamyn
      POSTGRES_DB: ollamyn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollamyn -d ollamyn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ollamyn-net

  redis:
    image: redis:7-alpine
    container_name: ollamyn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ollamyn-net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  ollamyn-net:
    driver: bridge

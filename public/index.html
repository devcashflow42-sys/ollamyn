<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ollamyn · Tu plataforma de IA</title>
  <meta name="description" content="ollamyn — chatea con múltiples inteligencias artificiales desde una sola plataforma." />
  <script>try{var t=localStorage.getItem('ollamyn_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <button class="theme-toggle" aria-label="Cambiar tema"></button>

  <div class="landing">
    <header>
      <span class="brand"><span class="dot"></span> ollamyn</span>
      <a class="btn subtle" href="/login">Iniciar sesión</a>
    </header>

    <main>
      <h1>Habla con la IA, <span class="grad">a tu manera</span>.</h1>
      <p class="lede">
        Una sola plataforma para conversar con distintos modelos de inteligencia
        artificial: rápidos, de razonamiento y multimodales. Rápido, privado y sin complicaciones.
      </p>
      <div class="cta">
        <a class="btn" id="cta-primary" href="/login?mode=register">Crear cuenta gratis</a>
        <a class="btn ghost" href="/login">Ya tengo cuenta</a>
      </div>
    </main>

    <footer>© <span id="year"></span> ollamyn</footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // Si ya hay sesión, el botón principal lleva directo al chat.
    if (window.TokenStore && window.TokenStore.isAuthenticated) {
      var c = document.getElementById('cta-primary');
      c.textContent = 'Ir al chat'; c.href = '/chat';
    }
  </script>
</body>
</html>

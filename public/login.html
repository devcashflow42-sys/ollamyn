<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ollamyn · Iniciar sesión</title>
  <meta name="description" content="Inicia sesión o crea tu cuenta en ollamyn." />
  <script>try{var t=localStorage.getItem('ollamyn_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <button class="theme-toggle" aria-label="Cambiar tema"></button>

  <div class="auth">
    <div class="auth-inner">
      <div class="auth-head">
        <a class="brand" href="/"><span class="dot"></span> ollamyn</a>
        <h2 id="auth-title">Bienvenido de nuevo</h2>
        <p id="auth-subtitle">Inicia sesión para continuar.</p>
      </div>

      <div class="alert" id="auth-alert" role="alert"></div>

      <form id="auth-form" novalidate>
        <div class="field" id="field-username" style="display:none">
          <label for="f-username">Nombre de usuario</label>
          <div class="input-wrap">
            <input class="input" id="f-username" type="text" autocomplete="username" placeholder="tu_usuario" />
          </div>
        </div>

        <div class="field">
          <label for="f-email">Email</label>
          <div class="input-wrap">
            <input class="input" id="f-email" type="email" autocomplete="email" placeholder="tu@email.com" required />
          </div>
        </div>

        <div class="field">
          <label for="f-password">Contraseña</label>
          <div class="input-wrap">
            <input class="input has-toggle" id="f-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="toggle-visibility" data-target="f-password" aria-label="Mostrar contraseña">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field" id="field-confirm" style="display:none">
          <label for="f-confirm">Confirmar contraseña</label>
          <div class="input-wrap">
            <input class="input has-toggle" id="f-confirm" type="password" autocomplete="new-password" placeholder="Repite la contraseña" />
            <button type="button" class="toggle-visibility" data-target="f-confirm" aria-label="Mostrar contraseña">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between" id="remember-row">
          <label class="checkbox"><input type="checkbox" id="f-remember" checked /> Recordarme</label>
        </div>

        <button class="btn full" id="auth-submit" type="submit">Iniciar sesión</button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">¿No tienes cuenta?</span>
        <button type="button" id="switch-btn">Crear una cuenta</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
